<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="stylesheet" type="text/css" href="/components/bootstrap-4.3.1-dist/css/bootstrap.min.css">
        <!-- <script src="/components/bootstrap-4.3.1-dist/js/bootstrap.min.js"></script> -->
        <script src="/components/js/main.js"></script>
        <link rel="stylesheet" href="/components/styles/main.css">
        <link rel="stylesheet" href="../styles/main.css">

        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>


    </head>
    <body onload="loadContent()">
        <nav id="navbar"></nav>
        <nav id="e7head"></nav>
        <div id="content">
            <div>
                <p class="center">Team Size</p>
                <input class="center" type="number" value="4" id="teamCount">
                <input class="center" type="button" onclick="generateTeam()" value="Generate Team">
                <div class="heroBlockList unitList" id="draftList"></div>
            </div>
            <hr>
            <div>
                <input type="button" value="Select Units" onclick="showUnit()">
                <input type="button" value="Update Unit List" onclick="showUpdate()">
            </div>

            <hr>
            <textarea id="chara-list"></textarea>
            <input type="button" onclick="clearSelection()" value="Clear Selection">

            <div id="unitSelect">
                <input type="button" onclick="updateList('unitList', heroData, document.getElementById('chara-list').value)" value="Manual update">
                <div class="center">
                    <span>Search</span>
                    <input type="text" value="" id="unitSearch" oninput="updateUnit()">
                </div>
                <div class="heroBlockList unitList" id="unitList"></div>
                </div>
            </div>
            <div id="unitUpdate" class="hidden">
                <div class="center">
                    <span>Search</span>
                    <input type="text" value="" id="selectSearch" oninput="updateSelect()">
                </div>
                <div class="heroBlockList unitList" id="selectList"></div>
            </div>
        </div>

    </body>
    <script>
        let heroData = [];
        function searchBlock(location, filter = "") {
            var input, unitBlock, unit, a, b;
            filter = filter.toString().toUpperCase();
            unitBlock = document.getElementById(location);
            unit = unitBlock.getElementsByTagName("div");
            for (let i = 0; i < unit.length; i++) {
                a = unit[i].getAttribute("_id");
                b = unit[i].getAttribute("name");
                if (a.toUpperCase().indexOf(filter) > -1 || b.toUpperCase().indexOf(filter) > -1) {
                    unit[i].style.display = "";
                } else {
                    unit[i].style.display = "none";
                }
            }
        }
        function updateUnit() {
            let list = JSON.parse(document.getElementById("chara-list").value);
            updateList("unitList", heroData, JSON.stringify(list));

            let filter = document.getElementById("unitSearch").value;
            searchBlock("unitList", filter);
        }
        function updateSelect() {
            let list = JSON.parse(document.getElementById("chara-list").value);
            updateList("selectList", JSON.parse(document.getElementById("chara-list").value), null, 1);
            
            let filter = document.getElementById("selectSearch").value;
            searchBlock("selectList", filter);
        }
        function clearSelection() {
            document.getElementById("chara-list").value = "[]";
            localStorage.setItem('ultimate-bravery-list', "[]");
            updateSelect();
            updateUnit();
        }
        function selectUnitHandler() {
            let list = document.getElementById("chara-list").value;
            if(list == null || list == "") {
                list = "[]";
            }
            list = JSON.parse(list);
            list.push({
                "id": this.getAttribute("id"),
                "_id": this.getAttribute("_id"),
                "name": this.getAttribute("name"),
                "count": 1,
            })
            this.classList.add("hidden");
            list.sort((a,b) => (a.name > b.name) ? 1 : ((b.name > a.name) ? -1 : 0))
            document.getElementById("chara-list").value = JSON.stringify(list);
            localStorage.setItem('ultimate-bravery-list', document.getElementById("chara-list").value);
        }
        function updateUnitHandler() {
            let list = document.getElementById("chara-list").value;
            if(list == null || list == "") {
                list = "[]";
            }
            list = JSON.parse(list);
            if (!confirm("Remove " + this.getAttribute("name") + "?")) {
                return;
            }
            this.classList.add("hidden");
            list = list.reduce((acc, item) => {
                if (item._id !== this.getAttribute("_id")) {
                    acc.push(item);
                }
                return acc;
            }, []);
            list.sort((a,b) => (a.name > b.name) ? 1 : ((b.name > a.name) ? -1 : 0))
            document.getElementById("chara-list").value = JSON.stringify(list);
            localStorage.setItem('ultimate-bravery-list', document.getElementById("chara-list").value);
        }
        function generateTeam() {
            const teamData = [];
            let list = [];
            let dupeOffset = 0;
            let baseList = JSON.parse(document.getElementById("chara-list").value);
            let teamSize = document.getElementById("teamCount").value;
            baseList.forEach(unit => {
                let counter = "";
                if(unit.count > 1) {
                    dupeOffset++;
                }
                for(let x = 0; x < unit.count; x++) {
                    if(unit.count > 1) {
                        counter = " " + (x + 1);
                    }
                    list.push({
                        id: unit.id,
                        name: unit.name + counter,
                        _id: unit._id
                    });
                }
            });
            if((list.length - dupeOffset) < teamSize) {
                return alert("Not enough units selected");
            }
            for(let i = 0; i < teamSize; i++) {
                const index = Math.floor(Math.random() * list.length);
                teamData.push(list[index]);
                list = list.reduce((acc, item) => {
                    if (item._id !== list[index]._id) {
                        acc.push(item);
                    }
                    return acc;
                }, []);
            }
            teamData.sort((a,b) => (a.name > b.name) ? 1 : ((b.name > a.name) ? -1 : 0))
            updateList("draftList", teamData, "[]", 1);
        }
        function updateList(location, data, list = null, showNames = 0) {
            document.getElementById(location).innerHTML = "";
            if(list == null || list == "") {
                list = "[]";
            }
            list = JSON.parse(list);

            data.forEach(unit => {
                if (!list.some(e => e._id === unit._id)) {
                    createUnitElem(location, unit, showNames)
                }
            });
        }
        function createUnitElem(location, data, showNames = 0) {
            const elemDiv = document.createElement('div');
            elemDiv.setAttribute('id', data.id);
            elemDiv.setAttribute('_id', data._id);
            elemDiv.setAttribute('name', data.name);
            elemDiv.classList.add("unit");
            elemDiv.classList.add("heroBlock");
            elemDiv.classList.add("hero-image");
            switch (location) {
                case "unitList":
                    elemDiv.addEventListener("click", selectUnitHandler, false);
                    break;
                case "selectList":
                    elemDiv.addEventListener("click", updateUnitHandler, false);
                    break;

                default:
                    console.log("No location handler set:", location);
                    break;
            }

            elemDiv.innerHTML = "<img class='png-icon medium' src='" +
                "https://raw.githubusercontent.com/CeciliaBot/E7Assets-Temp/main/assets/face/" + data.id + "_s.png'>";
            if(showNames !== 0) {
                elemDiv.innerHTML += "<p class='hero-name'>" + data.name + "</p>";
            }
            document.getElementById(location).appendChild(elemDiv);
        }
        function loadContent() {
            loadHTML("navbar", "/components/html/navbar")
            loadHTML("e7head", "/components/html/e7head")
            if(localStorage.getItem('ultimate-bravery-list') === null) {
                localStorage.setItem('ultimate-bravery-list', "[]");
            }
            
            getJSON("../data/cecilia-heroes.json").then(data => {
                heroData = data;
                document.getElementById("chara-list").value = localStorage.getItem('ultimate-bravery-list');
                showUnit();
                return;
            }).catch(error => {
                console.log(error);
                alert("Not able to get unit data");
            });
        }
        
        function showUnit() {
            updateUnit();
            document.getElementById("unitUpdate").classList.add("hidden");
            document.getElementById("unitSelect").classList.remove("hidden");
        }
        function showUpdate() {
            updateSelect();
            document.getElementById("unitUpdate").classList.remove("hidden");
            document.getElementById("unitSelect").classList.add("hidden");
        }
    </script>
</html>
