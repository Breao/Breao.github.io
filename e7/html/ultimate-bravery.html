<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="stylesheet" type="text/css" href="/components/bootstrap-4.3.1-dist/css/bootstrap.min.css">
        <!-- <script src="/components/bootstrap-4.3.1-dist/js/bootstrap.min.js"></script> -->
        <script src="/components/js/main.js"></script>
        <link rel="stylesheet" href="/components/styles/main.css">
        <link rel="stylesheet" href="../styles/main.css">

        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>


    </head>
    <body onload="loadContent()">
        <nav id="navbar"></nav>
        <nav id="e7head"></nav>
        <div id="content">
            <div>
                <p class="center">Team Size</p>
                <input class="center" type="number" value="4" id="teamCount">
                <input class="center" type="button" onclick="generateTeam()" value="Generate Team">
                <div class="heroBlockList unitList" id="draftList"></div>
                <input class="center" type="button" onclick="historyToggle()" value="Show/Hide History">
                <div class="historyHeader hidden" id="historyList">
                    <div id="historyContent"></div>
                    <input class="center" type="button" onclick="historyClear()" value="Clear History">
                </div>
            </div>
            <hr>
            <div>
                <input type="button" value="Select Units" onclick="showUnit()">
                <input type="button" value="Update Unit List" onclick="showUpdate()">
            </div>

            <hr>
            <textarea id="chara-list"></textarea>
            <input type="button" onclick="clearSelection()" value="Clear Selection">

            <div id="unitSelect">
                <input type="button" onclick="updateManual()" value="Manual update">
                <div class="center">
                    <span>Search</span>
                    <input type="text" value="" id="unitSearch" oninput="updateUnit()">
                </div>
                <div class="heroBlockList unitList" id="unitList"></div>
                </div>
            </div>
            <div id="unitUpdate" class="hidden">
                <div class="center">
                    <span>Search</span>
                    <input type="text" value="" id="selectSearch" oninput="updateSelect()">
                </div>
                <div class="heroBlockList unitList" id="selectList"></div>
            </div>
        </div>

    </body>
    <script>
        let heroData = [];
        function searchBlock(location, filter = "") {
            var input, unitBlock, unit, a, b;
            filter = filter.toString().toUpperCase();
            unitBlock = document.getElementById(location);
            unit = unitBlock.getElementsByClassName("heroBlock");
            for (let i = 0; i < unit.length; i++) {
                a = unit[i].getAttribute("_id");
                b = unit[i].getAttribute("name");
                if (a.toUpperCase().indexOf(filter) > -1 || b.toUpperCase().indexOf(filter) > -1) {
                    unit[i].style.display = "";
                } else {
                    unit[i].style.display = "none";
                }
            }
        }
        function updateUnit() {
            let list = JSON.parse(document.getElementById("chara-list").value);
            const location = "unitList";
            localStorage.setItem('ultimate-bravery-list', JSON.stringify(list));
            document.getElementById(location).innerHTML = "";
            updateList(location, heroData, JSON.stringify(list));

            let filter = document.getElementById("unitSearch").value;
            searchBlock(location, filter);
        }
        function updateSelect() {
            let list = JSON.parse(document.getElementById("chara-list").value);
            const location = "selectList";
            localStorage.setItem('ultimate-bravery-list', JSON.stringify(list));
            document.getElementById(location).innerHTML = "";
            updateList(location, JSON.parse(document.getElementById("chara-list").value), null, 1);
            
            let filter = document.getElementById("selectSearch").value;
            searchBlock("selectList", filter);
        }
        function updateManual() {
            const location = 'unitList';
            localStorage.setItem('ultimate-bravery-list', document.getElementById('chara-list').value);
            document.getElementById(location).innerHTML = "";
            updateList(location, heroData, document.getElementById('chara-list').value)
        }
        function clearSelection() {
            if (!confirm("Clear your selection")) {
                return;
            }
            document.getElementById("chara-list").value = "[]";
            updateSelect();
            updateUnit();
        }
        function selectUnitHandler() {
            let list = document.getElementById("chara-list").value;
            if(list == null || list == "") {
                list = "[]";
            }
            list = JSON.parse(list);
            list.push({
                "id": this.getAttribute("id"),
                "_id": this.getAttribute("_id"),
                "name": this.getAttribute("name"),
                "count": 1,
            })
            this.classList.add("hidden");
            list.sort((a,b) => (a.name > b.name) ? 1 : ((b.name > a.name) ? -1 : 0))
            document.getElementById("chara-list").value = JSON.stringify(list);
            localStorage.setItem('ultimate-bravery-list', document.getElementById("chara-list").value);
        }
        function updateUnitHandler(elem) {
            let list = document.getElementById("chara-list").value;
            if(list == null || list == "") {
                list = "[]";
            }
            list = JSON.parse(list);
            const unitIndex = list.findIndex(e => e.id === elem.getAttribute("heroId"));
            if(elem.value == "-" && list[unitIndex].count == 1) {
                if (!confirm("Remove " + elem.getAttribute("name") + "?")) {
                    return;
                }
                elem.parentElement.classList.add("hidden");
                list = list.reduce((acc, item) => {
                    if (item.id !== elem.getAttribute("heroId")) {
                        acc.push(item);
                    }
                    return acc;
                }, []);
            }
            else if(elem.value == "+") {
                list[unitIndex].count++;
            }
            else if(elem.value == "-") {
                list[unitIndex].count--;
            }
            document.getElementById(list[unitIndex].id+"SL_count").innerHTML = list[unitIndex].count;
            list.sort((a,b) => (a.name > b.name) ? 1 : ((b.name > a.name) ? -1 : 0))
            document.getElementById("chara-list").value = JSON.stringify(list);
            localStorage.setItem('ultimate-bravery-list', document.getElementById("chara-list").value);
        }
        function generateTeam() {
            const location = "draftList";
            const teamData = [];
            let list = [];
            let dupeOffset = 0;
            let baseList = JSON.parse(document.getElementById("chara-list").value);
            let teamSize = document.getElementById("teamCount").value;
            baseList.forEach(unit => {
                let counter = "";
                if(unit.count > 1) {
                    dupeOffset += (unit.count-1);
                }
                for(let x = 0; x < unit.count; x++) {
                    if(unit.count > 1) {
                        counter = " " + (x + 1)+"/"+unit.count;
                    }
                    list.push({
                        id: unit.id,
                        name: unit.name + counter,
                        _id: unit._id+"-"+counter
                    });
                }
            });
            if((list.length - dupeOffset) < teamSize) {
                return alert("Not enough units selected");
            }
            for(let i = 0; i < teamSize; i++) {
                const index = Math.floor(Math.random() * list.length);
                teamData.push(list[index]);
                list = list.reduce((acc, item) => {
                    if (item.id !== list[index].id) {
                        acc.push(item);
                    }
                    return acc;
                }, []);
            }
            document.getElementById(location).innerHTML = "";
            updateList(location, teamData, "[]", 1);
            updateHistory(teamData);
        }
        function updateList(location, data, list = null, showNames = 0) {
            if(list == null || list == "") {
                list = "[]";
            }
            list = JSON.parse(list);

            let counter = 1;
            data.forEach(unit => {
            if (!list.some(e => e._id === unit._id)) {
                    createUnitElem(location, unit, showNames)
                }
            });
        }
        function createUnitElem(location, data, showNames = 0) {
            const elemDiv = document.createElement('div');
            elemDiv.setAttribute('id', data.id);
            elemDiv.setAttribute('_id', data._id);
            elemDiv.setAttribute('name', data.name);
            elemDiv.classList.add("unit");
            elemDiv.classList.add("heroBlock");
            elemDiv.classList.add("hero-image");

            const labelDiv = document.createElement('div');
            const labelImg = document.createElement('img');
            labelImg.classList.add("png-icon")
            labelImg.classList.add("medium")
            labelImg.setAttribute('src', "https://raw.githubusercontent.com/CeciliaBot/E7Assets-Temp/main/assets/face/" + data.id + "_s.png");
            labelDiv.appendChild(labelImg);
            
            if(showNames !== 0) {
                const labelSpan = document.createElement('span');
                labelSpan.classList.add("hero-name");
                labelSpan.classList.add(data.id+"-hero-name");
                labelSpan.innerHTML = data.name;
                labelDiv.appendChild(labelSpan);
            }

            switch (location) {
                case "unitList":
                    elemDiv.addEventListener("click", selectUnitHandler, false);
                    break;
                case "selectList":
                    labelDiv.appendChild(document.createElement('br'));

                    const labelCount = document.createElement("span");
                    labelCount.innerHTML = data.count;
                    labelCount.setAttribute("count", true);
                    labelCount.setAttribute('id', data.id+"SL_count");

                    const labelPlus = document.createElement("input");
                    labelPlus.classList.add("SL-btn")
                    labelPlus.setAttribute("type", "button");
                    labelPlus.setAttribute("value", "+");
                    labelPlus.setAttribute("heroId", data.id);
                    labelPlus.setAttribute('_id', data._id);
                    labelPlus.setAttribute('name', data.name);
                    labelPlus.setAttribute('onclick', "updateUnitHandler(this)");

                    const labelMinus = document.createElement("input");
                    labelMinus.classList.add("SL-btn")
                    labelMinus.setAttribute("type", "button");
                    labelMinus.setAttribute("value", "-");
                    labelMinus.setAttribute("heroId", data.id);
                    labelMinus.setAttribute('_id', data._id);
                    labelMinus.setAttribute('name', data.name);
                    labelMinus.setAttribute('onclick', "updateUnitHandler(this)");

                    labelDiv.appendChild(labelMinus);
                    labelDiv.appendChild(labelCount);
                    labelDiv.appendChild(labelPlus);
                    break;

                default:
                    // console.log("No location handler set:", location);
                    break;
            }

            elemDiv.appendChild(labelDiv);
            document.getElementById(location).appendChild(elemDiv);
        }
        function historyToggle() {
            if (document.getElementById("historyList").classList.contains("hidden")) {
                document.getElementById("historyList").classList.remove("hidden");
            } else {
                document.getElementById("historyList").classList.add("hidden");
            }
        }
        function historyClear() {
            localStorage.setItem('e7-ultimate-bravery-history', JSON.stringify([]));
            updateHistory();
            window.scrollTo(0, 0);
        }
        function loadContent() {
            loadHTML("navbar", "/components/html/navbar")
            loadHTML("e7head", "/components/html/e7head")
            if(localStorage.getItem('ultimate-bravery-list') === null) {
                localStorage.setItem('ultimate-bravery-list', "[]");
            }
            if(localStorage.getItem('e7-ultimate-bravery-history') === null) {
                localStorage.setItem('e7-ultimate-bravery-history', "[]");
            }
            
            getJSON("../data/cecilia-heroes.json").then(data => {
                heroData = data;
                document.getElementById("chara-list").value = localStorage.getItem('ultimate-bravery-list');
                showUnit();
                updateHistory();
                return;
            }).catch(error => {
                console.log(error);
                alert("Not able to get unit data");
            });
        }
        function updateHistory(set = null) {
            const location = "historyContent";
            let history = JSON.parse(localStorage.getItem('e7-ultimate-bravery-history'));
            if(set != null) {
                let historyStorage = JSON.parse(localStorage.getItem('e7-ultimate-bravery-history'));
                historyStorage.unshift(set);
                if (historyStorage.length > 5) {
                    historyStorage.pop();
                }
                localStorage.setItem('e7-ultimate-bravery-history', JSON.stringify(historyStorage));
                if(historyStorage.size > 1) {
                    history = historyStorage;
                }
            }
            document.getElementById(location).innerHTML = "";
            let counter = 1;
            history.forEach(teams => {
                const elemHead = document.createElement('h5');
                elemHead.innerHTML = "Team " + counter;
                document.getElementById(location).appendChild(elemHead);
                const elemDiv = document.createElement('div');
                const id = "history"+counter++;
                elemDiv.setAttribute('id', id);
                elemDiv.classList.add("heroBlockList");
                elemDiv.classList.add("unitList");
                document.getElementById(location).appendChild(elemDiv);
                updateList(id, teams, "[]", 1);
            });
            if(history.length < 1) {
                document.getElementById(location).innerHTML = "<h5>No history</h5>";
            }
        }
        function showUnit() {
            updateUnit();
            document.getElementById("unitUpdate").classList.add("hidden");
            document.getElementById("unitSelect").classList.remove("hidden");
        }
        function showUpdate() {
            updateSelect();
            document.getElementById("unitUpdate").classList.remove("hidden");
            document.getElementById("unitSelect").classList.add("hidden");
        }
    </script>
</html>
